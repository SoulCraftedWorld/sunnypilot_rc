<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GPU-плавный слайдер (transform + rAF)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/main.css">
<style>
  /* Базовая сетка для примера */
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    padding: 24px;
    line-height: 1.4;
  }
  .row {
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }
  .col {
    flex: 0 0 auto;
  }



  /* ====== СТИЛИ СЛАЙДЕРА ====== */
  .slider {
    width: 22px;
    height: 100%; /* Высота слайдера */
    background-color: rgba(28, 102, 142, 0.5);
    border-radius: 5px;
    z-index: 1100;
    position: absolute;
    user-select: none;
    touch-action: none;
  }
  .slider.track-horizontal {
    width: 100%;
    height: 28px;
  }
  .slider.track-vertical {
    width: 28px;
    height: 100%;
  }

  /* Ручка слайдера — двигаем ТОЛЬКО transform */
  .slider__knob {
    position: absolute; /* якорим в (0,0), движение исключительно через transform */
    left: 0;
    top: 0;
    height: 37px;
    width: 60px;
    /*background: #3a74ff;*/
    will-change: transform;         /* подсказка для композитинга */
    transform: translate3d(0,0,0);  /* сразу на отдельный слой */
    cursor: pointer;
    touch-action: none;

    z-index: 1101;

    background-color: rgba(28, 62, 142, 0.7);
    border: 3px solid rgba(0, 0, 0, 0.4);
    border-radius: 25%;

    /*transform: translate(-50%, -50%);*/
    transition: top 0.2s ease-out; /* Плавное движение */
    box-shadow: 0 0 8px 10px rgba(143, 114, 224, 0.3);
  }


  /* Для вертикального — сместим ручку, чтобы она была по центру трека */
  .slider.track-vertical .slider__knob {
    height: 37px;
    width: 60px;
    left: -21px;
  }
  .slider.track-horizontal .slider__knob {
    height: 60px;
    width: 37px;
    top: -20px;
  }




.slider-container {
    display: flex;
    width: 40px;
    height: 400px; /* Высота контейнера */
    position: relative;
    margin: 10px;
    user-select: none;
    touch-action: none;
}
.slider-container.track-vertical {
    flex: 0 0 auto;
    flex-direction: row;
    align-content: flex-start;
    width: auto;
    gap: 5px;
    height: 400px;
    min-height: 400px;
}
.slider-container.track-horizontal {
    display: flex;
    gap: 5px;
    align-items: center;
    justify-items: center;
    flex-direction: column;
    width: 400px;
    min-width: 400px; /* Ширина контейнера */
    height: auto;
}


.slider-status {
    display: flex;
    font-size: 27px;
    height: 36px;
    text-align: center;
    white-space: nowrap;
    justify-content: center;
    background-color: rgba(0, 0, 0, 0.44); /* Тёмный фон для контраста */
    color: rgba(225, 218, 218, 0.84); /* Цвет текста */
    padding: 5px 6px;
    border-radius: 8px;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
}
.slider-status.track-horizontal{

}
.slider-status.track-vertical {
    transform: translate3d(-30%, -100%, 0);
}
.slider-status.track-horizontal.top{
    transform: translate3d(0, -150%, 0);
}
.slider-status.bottom {
    margin-top: 50px;
}

.slider-status.track-vertical.top{
    transform: translate3d(-30%, -120%, 0);
}
.slider-status.track-vertical.bottom{
    transform: translate3d(-30%, 120%, 0);
}

.slider-line {
    position: absolute;
    z-index: 1090;
    background-color: rgba(0, 0, 0, 0.2);
    left: 50%;
    border-radius: 10px 10px 0 0;
    width: 110%;
    height: 5px;
}

.slider-line.track-horizontal{
    left: 49%;
    top: -10%;
    width: 4px;
    height: 120%;
    border-radius: 0 0 10px 10px;
    background-color: rgba(255, 255, 255, 0.7);
    transform: translateY(-50%);
}

.slider-line.track-vertical{
    left: -10%;
    top: 49%;
    width: 120%;
    height: 4px;
    border-radius: 10px 10px 0 0;
    background-color: rgba(255, 255, 255, 0.7);
}

.slider-line.center {
    top: 50%;
    background-color: rgba(255, 255, 255, 0.7);
}

.slider-gradient {
    position: absolute;
    z-index: 1090;
    background-color: rgba(0, 0, 0, 0.2);
}


.slider-gradient.track-horizontal {
    top: 50%;
    width: 51%;
    height: 100%;
    transform: translateY(-50%);
}

.slider-gradient.accel.track-horizontal {
    border-radius: 0  15px 15px 0;
    left: 50%;
    background: linear-gradient(to left, rgba(236, 91, 113, 0.89), rgba(232, 151, 109, 0.3));
}

.slider-gradient.brake.track-horizontal {
    left: -1%;
    border-radius: 15px 0 0 15px;
    background: linear-gradient(to left, rgba(162, 162, 198, 0.47), rgba(55, 58, 218, 0.73));
}


.slider-gradient.track-vertical {
    left: 50%;
    height: 51%;
    width: 100%;
    transform: translateX(-50%);
}

.slider-gradient.accel.track-vertical {
    border-radius: 15px 15px 0  0  ;
    top: -1%;
    background: linear-gradient(to bottom, rgba(236, 91, 113, 0.89), rgba(232, 151, 109, 0.3));
}

.slider-gradient.brake.track-vertical {
    top: 50%;
    border-radius: 0  0 15px 15px;
    background: linear-gradient(to bottom, rgba(162, 162, 198, 0.47), rgba(55, 58, 218, 0.73));
}


</style>
</head>
<body style="background: #d7d7d7">

<h1>Плавный слайдер без лагов</h1>
<p>Движение ручки через <code>transform</code>, вычисления в <code>requestAnimationFrame</code>, без чтения layout на каждом событии.</p>

<div class="row">
  <div class="slider-container track-horizontal">
<div class="slider-status track-horizontal top">Горизонтальный: <span id="outX">0.0</span>%</div>
    <div id="sliderX" class="slider track-horizontal">
      <div id="knobX" class="slider__knob" aria-label="Horizontal slider knob"></div>
    </div>

  </div>

  <div class="slider-container track-vertical">
      <div class="slider-status track-vertical top">Вертикальный: <span id="outY">0.0</span>%</div>
    <div id="sliderY" class="slider track-vertical">
      <div id="knobY" class="slider__knob" aria-label="Vertical slider knob"></div>
    </div>

  </div>
</div>
<div class="row">
<div class="slider-container track-vertical" id="slider-vert-container-id">
                                        <div id="joystick-vert-out" class="slider-status track-vertical top">66%</div>
                                        <div id="slider-vert" class="slider track-vertical">
                                            <div class="track-vertical slider-gradient brake"></div>
                                            <div class="track-vertical slider-line center"></div>
                                            <div class="track-vertical slider-gradient  accel"></div>
                                            <div id="slider-vert-knob" class="slider__knob track-vertical"></div>
   </div>
</div>

<div class="slider-container track-horizontal" id="slider-hor-container-id" >
                                        <div id="joystick-hor-out" class="slider-status track-horizontal top">44%</div>
                                        <div id="slider-hor" class="slider track-horizontal">
                                            <div class="track-horizontal slider-gradient brake"></div>
                                            <div class="track-horizontal slider-line center"></div>
                                            <div class="track-horizontal slider-gradient accel"></div>
                                            <div id="slider-hor-knob" class="slider__knob track-horizontal"></div>
                                        </div>
</div>
</div>
<script>
/**
 * GPU-плавный контроллер слайдера:
 * - Pointer Events + setPointerCapture
 * - transform: translate3d(...) вместо left/top
 * - requestAnimationFrame (одна запись в DOM на кадр)
 * - Единицы: проценты 0..100 от ДОСТУПНОЙ длины (trackLength = size - knobSize)
 * - Колбэки: onProgress(percent) — во время перетаскивания (1/кадр), onChange(percent) — по отпусканию
 */
class SliderController {
  /**
   * @param {HTMLElement} sliderEl — трек
   * @param {HTMLElement} knobEl — ручка
   * @param {{
   *   isVertical?: boolean,
   *   minPercent?: number,          // 0..100
   *   maxPercent?: number,          // 0..100
   *   initialPercent?: number,      // 0..100
   *   onProgress?: (percent:number)=>void,
   *   onChange?: (percent:number)=>void
   * }} options
   */
  constructor(sliderEl, knobEl, options) {
    this.slider = sliderEl;
    this.knob = knobEl;
    this.options = {
      isVertical: !!(options && options.isVertical),
      minPercent: options && typeof options.minPercent === 'number' ? options.minPercent : 0,
      maxPercent: options && typeof options.maxPercent === 'number' ? options.maxPercent : 100,
      initialPercent: options && typeof options.initialPercent === 'number' ? options.initialPercent : 0,
      onProgress: options && typeof options.onProgress === 'function' ? options.onProgress : null,
      onChange: options && typeof options.onChange === 'function' ? options.onChange : null,
    };

    // Состояние
    this._dragging = false;
    this._rect = null;          // кеш геометрии трека
    this._knobSize = 0;         // ширина (гор.) или высота (верт.) ручки
    this._trackLength = 0;      // доступная длина перемещения = size - knobSize
    this._pointerOffset = 0;    // смещение указателя внутри ручки при нажатии
    this._rafId = 0;
    this._queuedPercent = null; // значение, ожидающее отрисовки
    this._percent = this._clamp(this.options.initialPercent);

    // Привязка методов
    this._onPointerDown = this._onPointerDown.bind(this);
    this._onPointerMove = this._onPointerMove.bind(this);
    this._onPointerUp   = this._onPointerUp.bind(this);
    this._onResize      = this._onResize.bind(this);

    // Инициализация
    this._measure();
    this._applyPercentImmediate(this._percent);
    this._attach();
  }

  destroy() {
    this._detach();
    if (this._rafId) cancelAnimationFrame(this._rafId);
  }

  setPercent(percent) {
    this._percent = this._clamp(percent);
    this._scheduleVisual(this._percent);
  }

  getPercent() {
    return this._percent;
  }

  // ====== ВНУТРЕННЕЕ ======

  _attach() {
    this.knob.addEventListener('pointerdown', this._onPointerDown);
    window.addEventListener('resize', this._onResize, { passive: true });
  }

  _detach() {
    this.knob.removeEventListener('pointerdown', this._onPointerDown);
    window.removeEventListener('resize', this._onResize);
    this._removeDocListeners();
  }

  _addDocListeners() {
    document.addEventListener('pointermove', this._onPointerMove);
    document.addEventListener('pointerup', this._onPointerUp);
    document.addEventListener('pointercancel', this._onPointerUp);
  }

  _removeDocListeners() {
    document.removeEventListener('pointermove', this._onPointerMove);
    document.removeEventListener('pointerup', this._onPointerUp);
    document.removeEventListener('pointercancel', this._onPointerUp);
  }

  _onResize() {
    const oldTrack = this._trackLength;
    this._measure();
    // Пересчёт translate под новую геометрию
    if (this._trackLength !== oldTrack) {
      this._applyPercentImmediate(this._percent);
    }
  }

  _measure() {
    // Один раз читаем layout
    const rect = this.slider.getBoundingClientRect();
    const knobRect = this.knob.getBoundingClientRect();

    if (this.options.isVertical) {
      this._rect = { top: rect.top, height: rect.height };
      this._knobSize = knobRect.height || 0;
      this._trackLength = Math.max(0, rect.height - this._knobSize);
    } else {
      this._rect = { left: rect.left, width: rect.width };
      this._knobSize = knobRect.width || 0;
      this._trackLength = Math.max(0, rect.width - this._knobSize);
    }
  }

  _onPointerDown(e) {
    e.preventDefault();
    this.knob.setPointerCapture(e.pointerId);

    // Обновляем измерения в момент начала перетаскивания
    this._measure();

    // Вычисляем смещение указателя внутри ручки,
    // чтобы движение было "за центр", а не резкий скачок
    const knobRect = this.knob.getBoundingClientRect();
    if (this.options.isVertical) {
      this._pointerOffset = e.clientY - knobRect.top;
    } else {
      this._pointerOffset = e.clientX - knobRect.left;
    }

    this._dragging = true;
    this._addDocListeners();

    // Мгновенная реакция при первом касании
    this._updateByPointer(e.clientX, e.clientY, true);
  }

  _onPointerMove(e) {
    if (!this._dragging) return;
    this._updateByPointer(e.clientX, e.clientY, false);
  }

  _onPointerUp(e) {
    if (!this._dragging) return;
    this._dragging = false;
    this.knob.releasePointerCapture(e.pointerId);
    this._removeDocListeners();

    // Финальный вызов onChange с текущим зафиксированным значением
    if (this.options.onChange) {
      this.options.onChange(this._percent);
    }
  }

  _updateByPointer(clientX, clientY, immediate) {
    // Проецируем координату указателя в позицию 0..trackLength
    let posPx;
    if (this.options.isVertical) {
      const raw = clientY - this._rect.top - this._pointerOffset;
      posPx = this._clampPx(raw, 0, this._trackLength);
      // Для "вверх = 100%" — инвертируем при вычислении процентов
      const percent = this._trackLength > 0 ? (1 - (posPx / this._trackLength)) * 100 : 0;
      this._percent = this._clamp(percent);
    } else {
      const raw = clientX - this._rect.left - this._pointerOffset;
      posPx = this._clampPx(raw, 0, this._trackLength);
      const percent = this._trackLength > 0 ? (posPx / this._trackLength) * 100 : 0;
      this._percent = this._clamp(percent);
    }

    if (immediate) {
      this._applyPercentImmediate(this._percent);
      if (this.options.onProgress) this.options.onProgress(this._percent);
    } else {
      this._scheduleVisual(this._percent); // одна запись на кадр
    }
  }

  _scheduleVisual(percent) {
    this._queuedPercent = percent;
    if (this._rafId) return;
    this._rafId = requestAnimationFrame(() => {
      this._rafId = 0;
      const p = this._queuedPercent;
      this._queuedPercent = null;
      this._applyPercentImmediate(p);
      if (this.options.onProgress) this.options.onProgress(p);
    });
  }

  _applyPercentImmediate(percent) {
    // Процент относится к ДОСТУПНОЙ длине (trackLength)
    if (this.options.isVertical) {
      const y = this._trackLength * (1 - percent / 100);
      this.knob.style.transform = 'translate3d(0,' + y + 'px,0)';
    } else {
      const x = this._trackLength * (percent / 100);
      this.knob.style.transform = 'translate3d(' + x + 'px,0,0)';
    }
  }

  _clamp(p) {
    const a = this.options.minPercent;
    const b = this.options.maxPercent;
    return Math.max(a, Math.min(p, b));
  }

  _clampPx(v, min, max) {
    return v < min ? min : (v > max ? max : v);
  }
}

/* ====== ДЕМО-ИНИЦИАЛИЗАЦИЯ ====== */
const outX = document.getElementById('outX');
const outY = document.getElementById('outY');
const joystick_vert_out = document.getElementById('joystick-vert-out');
const joystick_hor_out = document.getElementById('joystick-hor-out');

const sliderX = new SliderController(
  document.getElementById('sliderX'),
  document.getElementById('knobX'),
  {
    isVertical: false,
    minPercent: 0,
    maxPercent: 100,
    initialPercent: 20,
    onProgress: (p) => { outX.textContent = p.toFixed(1); },
    onChange:   (p) => { /* финальная фиксация — можно отправлять команду */ }
  }
);
const sliderY = new SliderController(
  document.getElementById('sliderY'),
  document.getElementById('knobY'),
  {
    isVertical: true,
    minPercent: 0,
    maxPercent: 100,
    initialPercent: 60,
    onProgress: (p) => { outY.textContent = p.toFixed(1); },
    onChange:   (p) => { /* финальная фиксация — можно отправлять команду */ }
  }
);

const sliderJoystick_vert = new SliderController(
  document.getElementById('slider-vert-knob'),
  document.getElementById('slider-vert-knob'),
  {
    isVertical: false,
    minPercent: 0,
    maxPercent: 100,
    initialPercent: 20,
    onProgress: (p) => { outX.textContent = p.toFixed(1); },
    onChange:   (p) => { /* финальная фиксация — можно отправлять команду */ }
  }
);

const sliderJoystick_hor = new SliderController(
  document.getElementById('slider-hor'),
  document.getElementById('slider-hor-knob'),
  {
    isVertical: false,
    minPercent: 0,
    maxPercent: 100,
    initialPercent: 20,
    onProgress: (p) => { outX.textContent = p.toFixed(1); },
    onChange:   (p) => { /* финальная фиксация — можно отправлять команду */ }
  }
);

// Пример программной установки:
setTimeout(() => {
  sliderX.setPercent(75);
}, 1200);
</script>
</body>
