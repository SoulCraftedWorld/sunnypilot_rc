      <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .loc_container {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: rgb(15 45 76 / 57%);
            color: #e6f4f1;
            position: absolute;
            border-bottom-right-radius: 1.5vh;
            border-bottom-left-radius: 1.5vh;
            z-index: 2000;
            width: 92%;
            height: 4.4vh;
            min-height: 3.7vh;
            top: 0;
            left: 4%;
            align-self: center;
            display: flex;
        }
        main {  display: flex;
            height: 100%;}

        .info_container {
            background-color: transparent;
            border-radius: 1.4vh / 45%;
            font-size: 2.2vh;
            border: 0.2vh solid rgba(187, 178, 178, 0.59);
        }
    </style>

  <body>
    <div class="fullscreen-container" id="fullscreen-container-id">
       <div class="loc_container">
           <main>
                <div id="fullscreen-button" data-tooltip="Полноэкранный режим."></div>

                <div id="steer-wheel-joystick-container"> </div>

                <div id="joystick-container-right" class="joystick-container right" >

                    <div id="joystick-button-space"  >

                        <div class="joystick-control-overlay">


                            <div class="joystick-vertical-buttons">

                                <div   class="joystick-horizontal-buttons frame"  id="throttle-stop-frame" >


                                    <div class="slider-container track-vertical" id="slider-accel-brake-container-id">
                                        <div id="joystick-value-throttle" class="slider-status track-vertical top"></div>
                                        <div id="slider-accel-brake" class="slider track-vertical">
                                            <div class="track-vertical slider-gradient brake"></div>
                                            <div class="track-vertical slider-line center"></div>
                                            <div class="track-vertical slider-gradient  accel"></div>
                                            <div id="slider-accel-brake-knob" class="slider slider__knob track-vertical"></div>
                                   </div>
                                </div>
                                    <div  style="margin-left: 3vh; display: flex; flex-direction: column; align-items: center;">
                                        <div   class="joystick-vertical-buttons" style="margin-top: 12.0vh;">

                                            <button class="joystick-control-button"  id="stop-btn" style="margin-top: 10.0vh;"   >
                                                <div class="joystick-control-button-image" id="stop-btn-image"> </div>
                                            </button>
                                            <div  class="vertical-slider-status" style="background-color:transparent; margin-top: -0.9vh;" >СТОП</div>
                                        </div>
                                    </div>


                                </div>
                            </div>

                        </div>

                    </div>
                </div>

               <header>
                    <div class="line_container">

                        <div class="icon-container" style="position: absolute; right: 0.7vw;">
                                    <div style="min-width: 11vh;">
                                        <div class="col-sm-12 col-md-6 details info_container" style="align-items: center; gap: 1vh; width: 100%;height: 100%;">
                                             <p class="bi bi-speedometer small" style="padding-left: 4px; font-size: 2vh;" ></p>
                                            <div class="icon-sub-sub-panel" >
                                                    <i id="cruise" class="pre-blob1">CC:OFF</i>
                                                </div>
                                      </div>
                                    </div>
                                    <div style="min-width: 11vh;">
                                        <div class="col-sm-12 col-md-6 details info_container" style="align-items: center; gap: 1vh; width: 100%;height: 100%;">
                                             <p class="bi bi-speedometer2 small" style="padding-left: 4px; font-size: 2vh;" ></p>
                                            <div class="icon-sub-sub-panel" >
                                                    <i id="speed" class="pre-blob1">33 km/h</i>
                                                </div>
                                      </div>
                                    </div>
                                    <div style="min-width: 11vh;">
                                        <div class="col-sm-12 col-md-6 details info_container" style="align-items: center; gap: 1vh; width: 100%;height: 100%;">
                                             <p class="bi bi-arrow-down-up small" style="padding-left: 4px;  font-size: 2vh;" ></p>
                                            <div class="icon-sub-sub-panel">
                                                    <i id="ping-time" class="pre-blob1">44 мс</i>
                                            </div>

                                      </div>
                                    </div>
                                    <div style="min-width: 11vh;">
                                        <div class="col-sm-12 col-md-6 details info_container" style="align-items: center; gap: 1vh; width: 100%;height: 100%;">
                                            <p class="bi bi-battery-half small" style="padding-left: 4px;  font-size: 2vh;"></p>
                                          <div class="icon-sub-sub-panel">
                                            <i id="battery" class="pre-blob1">55%</i>
                                          </div>

                                     </div>
                                    </div>

                                <div id="video-buttons-box" class="video-buttons">
                                    <button id="toggle-video-fullscreen"></button>
                                </div>

                        </div>

                    </div>
                </header>

                <div class="content">

                    <div id="video-container">
                        <video id="video" class="video-stream" playsinline autoplay muted loop poster="/static/pic/poster.png"></video>
                    </div>


                    <div  class="controls" id="controls-panel-id">

                        <div class="horizontal-items" style="display: flex; flex-direction: row; justify-content: center;">
                            <button id="joystick-cruise-active-btn" class="control-button" >КРУИЗ</button>
                            <button id="joystick-active-btn" class="control-button" >КОНТРОЛЬ</button>
                            <button id="plotter-btn" class="control-button" >ГРАФИК</button>

<!--                            <button type="button" id="start" class="btn btn-light btn-lg">Start</button>-->
<!--                            <button type="button" id="stop" class="btn btn-light btn-lg">Stop</button>-->

                        </div>

                    </div>


                </div>

               <div id="plotter-modal" class="hidden" >
                <h3 style="margin-top: 0; margin-bottom: 0.6vh;">Графики</h3>
                    <div class="panel_column" style="background: rgba(255,255,255,0.06);">
                      <div class="col-6"><canvas id="chart-ping" ></canvas></div>
                      <div class="col-6"><canvas id="chart-battery" ></canvas></div>
                    </div>
               </div>
