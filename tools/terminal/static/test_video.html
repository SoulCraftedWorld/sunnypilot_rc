<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title> Comma AI WebRTC Client</title>
</head>
<body>
    <video id="video" autoplay muted controls width="800"></video>
    <div>
        <button id="connectBtn">Подключиться</button>
        <button id="disconnectBtn" disabled>Отключиться</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');

        let peerConnection;
        const SERVER_URL = 'https://192.168.1.101:5001';

        // Создание WebRTC соединения
        function createPeerConnection() {
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            };

            peerConnection = new RTCPeerConnection(config);

            // Обработка входящих видеопотоков
            peerConnection.ontrack = (event) => {
                console.log('Получен видеопоток:', event.streams[0]);
                video.srcObject = event.streams[0];
            };

            // Обработка изменения состояния соединения
            peerConnection.onconnectionstatechange = () => {
                console.log('Состояние соединения:', peerConnection.connectionState);
                if (peerConnection.connectionState === 'connected') {
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                } else if (peerConnection.connectionState === 'disconnected') {
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                }
            };

            return peerConnection;
        }

        // Подключение к серверу
        async function connect() {
            try {
                peerConnection = createPeerConnection();

                // Создание offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // Отправка offer на сервер
                const response = await fetch(`${SERVER_URL}/offer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sdp: offer.sdp,
                        type: offer.type,
                        video: ['camera']  // Укажите ожидаемые типы камер
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const answer = await response.json();

                // Установка answer от сервера
                await peerConnection.setRemoteDescription(answer);

            } catch (error) {
                console.error('Ошибка подключения:', error);
                alert('Ошибка подключения: ' + error.message);
            }
        }

        // Отключение
        function disconnect() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            video.srcObject = null;
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        }

        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);
    </script>
</body>
</html>
